<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#eab308" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Serrat" />
    <meta name="application-name" content="Serrat Operador" />
    <meta name="description" content="App do Operador - Scanner QR Code e Ordens de Servico" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <title>Serrat</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service worker so no build. No dev server ele guardava os modulos do Vite (e ate
      // paginas de outro app que roda na mesma porta) e servia a copia velha: tela em branco.
      // Em dev, desliga o que tiver ficado registrado de antes.
      if ("serviceWorker" in navigator) {
        if ("%PROD%" === "true") {
          window.addEventListener("load", () => {
            navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(() => {});
          });
        } else {
          navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister()));
          if (window.caches) caches.keys().then((ks) => ks.filter((k) => k.startsWith("serrat-operador")).forEach((k) => caches.delete(k)));
        }
      }
    </script>
  </body>
</html>
